name: inboxassist_dev

services:
  app:
    build:
      context: .
      target: dev
    container_name: inboxassist_dev
    ports:
      - "127.0.0.1:6500:3000"
    env_file:
      - .env
    volumes:
      - .:/app:Z
      - /app/node_modules:Z
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - inboxassist

  postgres:
    image: postgres:16-alpine
    container_name: inboxassist_pg_dev
    environment:
      - POSTGRES_USER=${DATABASE_USER}
      - POSTGRES_PASSWORD=${DATABASE_PASSWORD}
      - POSTGRES_DB=${DATABASE_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER} -d ${DATABASE_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - inboxassist
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    container_name: inboxassist_redis_dev
    restart: unless-stopped
    networks:
      - inboxassist
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  test:
    build:
      context: .
      target: builder
    container_name: inboxassist_test
    env_file:
      - .env
    volumes:
      - ./tests:/app/tests
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - inboxassist
    entrypoint: ["/bin/sh", "-c", "npx drizzle-kit migrate && npm run test"]
    profiles:
      - test

networks:
  inboxassist:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
