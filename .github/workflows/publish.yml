name: build, test, and deploy
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup
        run: |
          echo <<EOF > .env
          DATABASE_USER={{ SECRETS.DATABASE_USER }}
          DATABASE_PASSWORD={{ SECRETS.DATABASE_PASSWORD }}
          DATABASE_NAME={{ SECRETS.DATABASE_NAME }}
          DATABASE_URL={{ SECRETS.DATABASE_URL }}
          REDIS_URL={{ SECRETS.REDIS_URL}}
          EOF
      - name: Run tests
        run: docker compose up test --abort-on-container-exit
      - name: Teardown
        if: always()
        run: docker compose down -v

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build and push
        id: docker_build
        uses: docker/build-push-action@v4
        with:
          context: .
          target: runner
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/wepco:inboxassist
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/wepco:inboxassist
          cache-to: type=inline

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: update website
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: update ${{ github.event.repository.name }}
